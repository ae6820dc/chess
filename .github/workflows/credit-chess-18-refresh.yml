name: Credit Chess 18 refreshed APK
on:
  push:
    branches: [main]
    paths: ['android-credit-chess-refresh/**', '.github/workflows/credit-chess-18-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build offline app and compare original assets
        run: python3 android-credit-chess-refresh/build-sdk.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Stockfish, Arena and persistence on Android 16 offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: |
            adb install android-credit-chess-refresh/build/Credit-Chess-18.apk
            adb install android-credit-chess-refresh/build/tests.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -e phase seed io.github.ae6820dc.creditchess.test/io.github.ae6820dc.studio.SmokeInstrumentation | tee android-credit-chess-refresh/build/seed.txt
            grep -q 'PASS ' android-credit-chess-refresh/build/seed.txt
            adb shell am force-stop io.github.ae6820dc.creditchess
            adb shell am instrument -w -e phase verify io.github.ae6820dc.creditchess.test/io.github.ae6820dc.studio.SmokeInstrumentation | tee android-credit-chess-refresh/build/verify.txt
            grep -q 'PASS ' android-credit-chess-refresh/build/verify.txt
      - name: Publish verified APK
        run: |
          cp android-credit-chess-refresh/build/Credit-Chess-18.apk android-distributions/Credit-Chess-18-latest.apk
          cp android-credit-chess-refresh/build/verify.txt android-distributions/Credit-Chess-18-latest.verification.txt
          sha256sum android-distributions/Credit-Chess-18-latest.apk > android-distributions/Credit-Chess-18-latest.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-distributions/Credit-Chess-18-latest*
          git commit -m 'Add freshly verified Credit Chess 18 offline APK'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Credit-Chess-18
          path: |
            android-credit-chess-refresh/build/*.apk
            android-credit-chess-refresh/build/*.txt
