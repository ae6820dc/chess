name: Native Stockfish 19 APK
on:
  push:
    paths: ['android-stockfish19-native/**', '.github/workflows/stockfish19-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Compile full ARM64 Stockfish and signed offline APK
        run: python3 android-stockfish19-native/build.py
      - name: Compile identical engine and host for emulator
        run: python3 android-stockfish19-native/build.py --test-x86
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native engine, Arena and saved games on Android 16 offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          script: |
            adb install android-stockfish19-native/build/Credit-Chess-Stockfish-19-x86-test.apk
            adb install android-stockfish19-native/build/tests.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -e phase seed io.github.ae6820dc.creditchess.sf19native.test/io.github.ae6820dc.studio.SmokeInstrumentation | tee android-stockfish19-native/build/seed.txt
            grep -q 'PASS ' android-stockfish19-native/build/seed.txt
            adb shell am force-stop io.github.ae6820dc.creditchess.sf19native
            adb shell am instrument -w -e phase verify io.github.ae6820dc.creditchess.sf19native.test/io.github.ae6820dc.studio.SmokeInstrumentation | tee android-stockfish19-native/build/verify.txt
            grep -q 'PASS ' android-stockfish19-native/build/verify.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Credit-Chess-Stockfish-19-Native
          path: |
            android-stockfish19-native/build/Credit-Chess-Stockfish-19.apk
            android-stockfish19-native/build/Credit-Chess-Stockfish-19-source.tar.gz
            android-stockfish19-native/build/*.txt
            android-stockfish19-native/build/*.sha256
