name: PWA and regression tests
on:
  push:
    paths: ['credit-chess/stockfish/**', 'credit-chess/stockfish-19/**', '.github/workflows/pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        edition: [stockfish, stockfish-19]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: credit-chess/${{ matrix.edition }}/package-lock.json
      - run: npm ci
        working-directory: credit-chess/${{ matrix.edition }}
      - run: npx playwright install --with-deps chromium
        working-directory: credit-chess/${{ matrix.edition }}
      - run: npm test
        working-directory: credit-chess/${{ matrix.edition }}
      - run: CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") npm run test:browser
        working-directory: credit-chess/${{ matrix.edition }}
      - name: Compare viewport failures with original version
        if: failure()
        continue-on-error: true
        working-directory: credit-chess/${{ matrix.edition }}
        run: |
          git fetch --depth=1 origin 868934c41ae8512a810acc3e22ba7bb1d95d31c8
          git worktree add /tmp/chess-pwa-baseline FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/credit-chess/stockfish/node_modules" /tmp/chess-pwa-baseline/credit-chess/stockfish/node_modules
          cp tests/browser/board-size.spec.js /tmp/chess-pwa-baseline/credit-chess/stockfish/tests/browser/board-size.spec.js
          cd /tmp/chess-pwa-baseline/credit-chess/stockfish
          CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") npx playwright test board-size.spec.js tablet-animation.spec.js --grep 'maximum board|tablet orientation'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results-${{ matrix.edition }}
          path: credit-chess/${{ matrix.edition }}/test-results
  multiple-pwas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: chess
      - uses: actions/checkout@v4
        with:
          repository: ae6820dc/9062
          ref: cce076c7479002138254ae4f67bc84678feb8e78
          path: '9062'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r chess/credit-chess/stockfish/tests/pwa/requirements.txt
      - run: python chess/credit-chess/stockfish/tests/pwa/check-config.py
      - run: |
          python chess/credit-chess/stockfish/tests/pwa/server.py &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/chess/credit-chess/stockfish/tablet.html > /dev/null && break
            sleep 1
          done
          xvfb-run -a python chess/credit-chess/stockfish/tests/pwa/browser.py
          PWA_BROWSER_PATH=/usr/bin/google-chrome python chess/credit-chess/stockfish/tests/pwa/editions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiple-pwa-results
          path: pwa-results.json
