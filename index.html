ype": "file"}, {"name": "tablet.html-412x915.png", "type": "file"}, {"name": "tablet.html-768x1024.png", "type": "file"}, {"name": "tablet.html-915x412.png", "type": "file"}, {"name": "tablet.html.json", "type": "file"}]}, {"name": "issue-7", "type": "dir", "children": [{"name": "README.md", "type": "file"}]}]}, {"name": "tests", "type": "dir", "children": [{"name": "browser", "type": "dir", "children": [{"name": "app.spec.js", "type": "file"}, {"name": "arena-capacity.spec.js", "type": "file"}, {"name": "arena-stop.spec.js", "type": "file"}, {"name": "board-size.spec.js", "type": "file"}, {"name": "credits.spec.js", "type": "file"}, {"name": "drag.spec.js", "type": "file"}, {"name": "engine.spec.js", "type": "file"}, {"name": "landing.spec.js", "type": "file"}, {"name": "layout.spec.js", "type": "file"}, {"name": "premoves.spec.js", "type": "file"}, {"name": "profiles.spec.js", "type": "file"}, {"name": "response-delay.spec.js", "type": "file"}, {"name": "storage.spec.js", "type": "file"}, {"name": "tablet-animation.spec.js", "type": "file"}]}, {"name": "arena-history.test.js", "type": "file"}, {"name": "arena.test.js", "type": "file"}, {"name": "core.test.js", "type": "file"}, {"name": "credits.test.js", "type": "file"}, {"name": "openings.test.js", "type": "file"}, {"name": "premoves.test.js", "type": "file"}, {"name": "server.js", "type": "file"}]}, {"name": "vendor", "type": "dir", "children": [{"name": "CHESS-JS-LICENSE.txt", "type": "file"}, {"name": "chess.js", "type": "file"}, {"name": "NOTICE.md", "type": "file"}, {"name": "SHA256SUMS", "type": "file"}, {"name": "stockfish-18-lite-single.js", "type": "file"}, {"name": "stockfish-18-lite-single.wasm", "type": "file"}, {"name": "STOCKFISH-AUTHORS.txt", "type": "file"}, {"name": "STOCKFISH-LICENSE.txt", "type": "file"}, {"name": "stockfish-source.tar.gz", "type": "file"}]}, {"name": ".gitignore", "type": "file"}, {"name": "animation.js", "type": "file"}, {"name": "app.js", "type": "file"}, {"name": "arena.js", "type": "file"}, {"name": "board-layout.css", "type": "file"}, {"name": "core.js", "type": "file"}, {"name": "credits.js", "type": "file"}, {"name": "desktop.html", "type": "file"}, {"name": "engine.js", "type": "file"}, {"name": "icon.svg", "type": "file"}, {"name": "index.html", "type": "file"}, {"name": "landing.css", "type": "file"}, {"name": "layout.js", "type": "file"}, {"name": "LICENSE.txt", "type": "file"}, {"name": "opening-worker.js", "type": "file"}, {"name": "openings.js", "type": "file"}, {"name": "package-lock.json", "type": "file"}, {"name": "package.json", "type": "file"}, {"name": "playwright.config.js", "type": "file"}, {"name": "premoves.js", "type": "file"}, {"name": "proof.html", "type": "file"}, {"name": "README.md", "type": "file"}, {"name": "storage.js", "type": "file"}, {"name": "style.css", "type": "file"}, {"name": "sw.js", "type": "file"}, {"name": "tablet.css", "type": "file"}, {"name": "tablet.html", "type": "file"}, {"name": "tablet.webmanifest", "type": "file"}, {"name": "TEST-RESULTS.md", "type": "file"}]}]}, {"name": "readme.html", "type": "file"}];
    let current = [];

    function getItems(){
      let items = tree;
      for (const part of current) items = items.find(x => x.name === part).children;
      return items;
    }
    function render(){
      document.getElementById('path').textContent = '/' + current.join('/') + (current.length ? '/' : '');
      document.getElementById('back').style.display = current.length ? 'inline-block' : 'none';
      const list = document.getElementById('list');
      list.innerHTML = '';
      for (const item of getItems()){
        const el = document.createElement('a');
        el.className = 'item ' + (item.type === 'dir' ? 'folder' : '');
        el.textContent = (item.type === 'dir' ? '📁 ' : '📄 ') + item.name;
        if (item.type === 'dir') {
          el.href = '#';
          el.onclick = e => { e.preventDefault(); current.push(item.name); render(); };
        } else {
          const path = [...current, item.name].map(encodeURIComponent).join('/');
          el.href = path;
          el.target = '_blank';
        }
        list.appendChild(el);
      }
    }
    function goHome(){ current = []; render(); }
    function goBack(){ current.pop(); render(); }
    render();
  </script>
</body>
